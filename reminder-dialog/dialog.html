<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="saveReminder">Set Reminder</title>
  <link rel="stylesheet" href="dialog.css">
</head>
<body>
  <div class="dialog-container">
    <h2 data-i18n="saveReminder">Set Reminder</h2>

    <div class="message-info">
      <div class="label" data-i18n="emailLabel">Email:</div>
      <div class="subject" id="subject" data-i18n="loading">Loading...</div>
      <div class="sender" id="sender"></div>
    </div>

    <div class="form-group">
      <label for="dueDate" data-i18n="remindOn">Remind me on:</label>
      <input type="datetime-local" id="dueDate" required>
    </div>

    <div class="quick-options">
      <button type="button" data-minutes="60" data-i18n="inOneHour">In 1 hour</button>
      <button type="button" data-minutes="240" data-i18n="inFourHours">In 4 hours</button>
      <button type="button" data-days="1" data-i18n="tomorrowMorning">Tomorrow 9am</button>
      <button type="button" data-days="7" data-i18n="nextWeek">Next week</button>
    </div>

    <div class="form-group">
      <label for="notes" data-i18n="notesLabel">Notes (optional):</label>
      <textarea id="notes" rows="3" placeholder="Add a note to remind yourself why..." data-i18n-placeholder="notesPlaceholder"></textarea>
    </div>

    <div class="button-row">
      <button type="button" id="cancelBtn" class="secondary" data-i18n="cancel">Cancel</button>
      <button type="button" id="saveBtn" class="primary" data-i18n="saveReminder">Set Reminder</button>
    </div>
  </div>

  <script src="../i18n.js"></script>
  <script src="dialog.js"></script>
</body>
</html>
