<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="allRemindersTitle">All Reminders - Email Reminders</title>
  <link rel="stylesheet" href="list.css">
</head>
<body>
  <div class="page-container">
    <header>
      <h1 data-i18n="extensionName">Email Reminders</h1>
      <div class="header-actions">
        <select id="filterStatus">
          <option value="active" data-i18n="activeReminders">Active Reminders</option>
          <option value="all" data-i18n="allReminders">All Reminders</option>
          <option value="pending" data-i18n="pending">Pending</option>
          <option value="completed" data-i18n="completed">Completed</option>
          <option value="dismissed" data-i18n="dismissed">Dismissed</option>
        </select>
      </div>
    </header>

    <main>
      <div id="loading" class="loading" data-i18n="loadingReminders">Loading reminders...</div>

      <div id="empty-state" class="empty-state hidden">
        <h2 data-i18n="noRemindersFound">No reminders found</h2>
        <p data-i18n="listEmptyHint">Right-click an email in your inbox and select "Set Reminder..." to get started.</p>
      </div>

      <div id="reminders-container" class="reminders-container hidden">
        <table class="reminders-table">
          <thead>
            <tr>
              <th class="col-status" data-i18n="status">Status</th>
              <th class="col-subject" data-i18n="subject">Subject</th>
              <th class="col-sender" data-i18n="from">From</th>
              <th class="col-due" data-i18n="dueColumn">Due</th>
              <th class="col-actions" data-i18n="actions">Actions</th>
            </tr>
          </thead>
          <tbody id="reminders-tbody"></tbody>
        </table>
      </div>
    </main>

    <footer>
      <p id="extensionVersion"></p>
    </footer>
  </div>

  <script src="../i18n.js"></script>
  <script src="list.js"></script>
</body>
</html>
